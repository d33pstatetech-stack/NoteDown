[package]
name = "localnotes-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Local-First Markdown Notes desktop shell"
license = "MIT"

[lib]
name = "localnotes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Only the dialog plugin is needed: the webview picks where to put an exported
# archive. Notes are written by the Rust core, not by frontend filesystem calls.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notes-store = { path = "../../../crates/notes-store" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
