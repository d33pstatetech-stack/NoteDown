[package]
name = "sqlite-bridge"
version = "0.1.0"
edition = "2021"
description = "Headless driver for the desktop SQLite core, used by end-to-end tests"
license = "MIT"
publish = false

# Deliberately depends only on the *storage* crate, never on the Tauri crate.
# That is what makes the end-to-end tests meaningful: they exercise the real
# SQLite implementation and its migrations, not the IPC wrapper around it.
[dependencies]
notes-store = { path = "../../../crates/notes-store" }
serde = "1"
serde_json = "1"

[[bin]]
name = "sqlite-bridge"
path = "src/main.rs"